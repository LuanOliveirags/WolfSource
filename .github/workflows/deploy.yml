name: Deploy Produção (Firebase Hosting)

# Dispara em qualquer push para a branch main
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "firebase-hosting-live"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build www/
        run: node infra/scripts/copy-web.js

      # channelId "live" publica no site de produção:
      # https://financeiro-lopes.web.app
      - name: Deploy para Firebase Hosting (produção)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FINANCEIRO_LOPES }}
          projectId: financeiro-lopes
          channelId: live
